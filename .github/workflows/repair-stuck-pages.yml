name: Repair stuck Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.PAGES_REPAIR_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Saikumarurukuti/SAIKUMAR-PORTFOLIO./pages/deployments/8e932325ab3872278d5e8e1c6c184eff632e6ef5/cancel"

      - name: Retry failed deployment
        env:
          GH_TOKEN: ${{ secrets.PAGES_REPAIR_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Saikumarurukuti/SAIKUMAR-PORTFOLIO./actions/runs/41289027230/rerun-failed-jobs"
